# experiment settings
experiment:
  output: output
  exp_name: null
  seed: 0
  workers: 4
  prefetch_factor: 4
  pin_mem: true

# data settings
data:
  dataset_dir: ~/data/VideoCompression/evaluation/PNG/BT.601/UVG/1920x1080
  dataset: Jockey
  video_size: [-1, -1, -1]
  patch_size: [1, -1, -1]
  fmt: png
  yuv_fmt: null   # optional explicit YUV pixel format (e.g., yuv420p, yuv420p10le)
  yuv_size: [-1, -1, -1]  # optional explicit [T, H, W] for YUV input; falls back to parsing the name

# training settings (per stage)
train:
  # stage selection: s1 or s2
  stage: s1
  
  # training hyperparameters
  epochs: 360
  eval_epochs: 20
  warmup_epochs: 10
  eval_only: false
  rate_steps: 8
  
  # batch settings
  grad_accum: 1
  train_batch_size: 144
  eval_batch_size: 1
  train_patch_size: [1, 120, 120]
  eval_patch_size: [1, -1, -1]
  
  # optimizer settings
  opt: adam
  sched: cosine
  lr: 2e-3
  warmup_lr: 1e-5
  min_lr: 1e-4
  auto_lr_scaling: false
  max_norm: 2.0
  norm_type: 2.0
  weight_decay: 1e-6
  weight_decay_scaling: true
  opt_eps: 1e-8
  opt_betas: [0.9, 0.999]
  momentum: 0.9
  decay_milestones: [0.5, 0.75]
  decay_rate: 0.5
  lr_scale: []
  
  # coding settings
  start_frame: -1
  num_frames: -1
  intra_period: -1

# logging settings
logging:
  log_epochs: -2
  log_iters: -2
  train_enable_log: false
  eval_enable_log: false
  log_level: info

# resume settings
resume:
  path: null
  model_only: false
  model_pat: null

# task settings
task:
  loss: [0.7, l1, 0.3, ms-ssim]
  metric: [psnr, ms-ssim]
  color_space: RGB
  lamb: 1.0
  
  # train task can override (uses 5x5 kernel for speed)
  train_loss: [0.7, l1, 0.3, ms-ssim-5x5]
  train_metric: [psnr, ms-ssim-5x5]

# model settings (will be selected from base/model.yaml)
model:
  size: l  # xs, s, m, l, xxl
  type: HiNeRV
  config: null  # loaded from base/model.yaml based on size

# compression model settings (will be selected from base/compress.yaml)
compress:
  stage: s1  # s1 or s2, synced with train.stage
  type: ISCAS26
  config: null  # loaded from base/compress.yaml based on stage
